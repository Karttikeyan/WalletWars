<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalletWars — Combat Card v2.1 (live data)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --black:#080808; --gold:#C9A84C; --gold-l:#F0D080; --gold-d:#8B6914;
  --red:#CC2200; --red-d:#8B1A1A; --silver:#A8B4C0; --purple:#8b5cf6; --purple-l:#c4b5fd;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#04020A; min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:28px; padding:40px 24px;
  font-family:'Cinzel', serif;
}

/* ── FORGE CONTROL ── */
.forge-bar { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:520px; }
.forge-title { font-size:0.55rem; letter-spacing:0.4em; color:rgba(168,180,192,0.4); text-transform:uppercase; }
.forge-row { display:flex; gap:8px; width:100%; }
.forge-input {
  flex:1; padding:10px 12px; border-radius:5px; border:1px solid rgba(201,168,76,0.25);
  background:rgba(255,255,255,0.03); color:var(--gold-l); font-family:'Cinzel', serif;
  font-size:0.7rem; letter-spacing:0.05em; outline:none;
}
.forge-input:focus { border-color:var(--gold); }
.forge-btn {
  padding:10px 20px; border-radius:5px; border:1px solid var(--gold);
  background:rgba(201,168,76,0.1); color:var(--gold-l); font-family:'Cinzel', serif;
  font-size:0.6rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer;
  transition:all 0.25s; white-space:nowrap;
}
.forge-btn:hover { background:rgba(201,168,76,0.22); }
.forge-status { font-size:0.55rem; letter-spacing:0.1em; color:var(--silver); min-height:14px; opacity:0.7; }

/* ── CARD SHELL ── */
.ww-card {
  width:320px; height:560px; position:relative; border-radius:16px; overflow:hidden;
  cursor:pointer; transition:transform 0.4s cubic-bezier(0.23,1,0.32,1); transform-style:preserve-3d;
}
.ww-card:hover { transform:translateY(-10px) scale(1.03); }
.card-canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:16px; }
.card-overlay { position:absolute; inset:0; border-radius:16px; pointer-events:none; }
.card-frame { position:absolute; inset:0; border-radius:16px; pointer-events:none; }
.card-content { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; border-radius:16px; overflow:hidden; }

.card-top { width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px; background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); }
.card-rank-badge { font-family:'Cinzel', serif; font-size:0.5rem; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; padding:4px 10px; border-radius:3px; border:1px solid; }
.card-season { font-size:0.38rem; letter-spacing:0.25em; color:rgba(168,180,192,0.5); text-transform:uppercase; }

.card-art-zone { flex:1; width:100%; position:relative; display:flex; align-items:center; justify-content:center; }
.card-medallion { width:100px; height:100px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:3rem; position:relative; z-index:2; border:3px solid; transition:all 0.5s; }
.card-medallion::before { content:''; position:absolute; inset:-8px; border-radius:50%; border:1px solid; opacity:0.3; animation:medalRing 3s ease-in-out infinite; }
.card-medallion::after { content:''; position:absolute; inset:-16px; border-radius:50%; border:1px solid; opacity:0.15; animation:medalRing 3s ease-in-out infinite reverse; }
@keyframes medalRing { 0%,100%{transform:scale(1);opacity:0.3;} 50%{transform:scale(1.08);opacity:0.6;} }

.card-bottom { width:100%; background:linear-gradient(to top, rgba(0,0,0,0.97) 62%, transparent); padding:22px 14px 12px; display:flex; flex-direction:column; gap:7px; }
.card-name-row { display:flex; flex-direction:column; align-items:center; gap:3px; }
.card-name { font-family:'Cinzel Decorative', serif; font-size:1rem; font-weight:700; letter-spacing:0.15em; text-align:center; text-transform:uppercase; line-height:1.1; }
.card-title { font-family:'IM Fell English', serif; font-size:0.65rem; font-style:italic; letter-spacing:0.1em; color:rgba(168,180,192,0.6); text-align:center; }

.card-power-row { display:flex; align-items:center; gap:8px; }
.card-power-label { font-size:0.38rem; letter-spacing:0.3em; text-transform:uppercase; white-space:nowrap; opacity:0.5; min-width:52px; }
.card-power-track { flex:1; height:5px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
.card-power-fill { height:100%; border-radius:3px; transition:width 1.5s cubic-bezier(0.25,0.46,0.45,0.94); position:relative; }
.card-power-fill::after { content:''; position:absolute; right:0; top:0; bottom:0; width:6px; background:rgba(255,255,255,0.6); border-radius:3px; filter:blur(2px); }
.card-power-val { font-size:0.52rem; font-weight:700; letter-spacing:0.1em; min-width:38px; text-align:right; }

.card-divider { height:1px; background:linear-gradient(to right, transparent, currentColor, transparent); opacity:0.15; margin:2px 4px; }

/* STATS — 5 combat dimensions */
.card-stats { display:flex; justify-content:space-between; gap:3px; }
.card-stat { display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; }
.card-stat-val { font-size:0.62rem; font-weight:700; letter-spacing:0.03em; }
.card-stat-label { font-size:0.32rem; letter-spacing:0.12em; text-transform:uppercase; color:rgba(168,180,192,0.45); }

/* NET WORTH — discreet display line */
.card-networth { display:flex; align-items:center; justify-content:space-between; padding:2px 2px; }
.card-networth-label { font-size:0.36rem; letter-spacing:0.3em; text-transform:uppercase; opacity:0.45; }
.card-networth-val { font-size:0.6rem; font-weight:700; letter-spacing:0.05em; color:var(--silver); }

/* BADGES — two rows */
.card-badge-block { display:flex; flex-direction:column; gap:5px; }
.card-badge-rowlabel { font-size:0.3rem; letter-spacing:0.3em; text-transform:uppercase; opacity:0.35; text-align:center; }
.card-badges { display:flex; justify-content:center; gap:6px; }
.card-badge { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.4); position:relative; transition:all 0.3s; }
.card-badge.earned { background:rgba(0,0,0,0.6); box-shadow:0 0 8px currentColor; }
.card-badge.locked { filter:grayscale(1) brightness(0.3); }
.card-badge.earned::after { content:''; position:absolute; inset:-3px; border-radius:50%; border:1px solid currentColor; opacity:0.3; animation:badgePulse 2s ease-in-out infinite; }
@keyframes badgePulse { 0%,100%{opacity:0.3;transform:scale(1);} 50%{opacity:0.6;transform:scale(1.1);} }

.card-footer { display:flex; justify-content:space-between; align-items:center; padding-top:2px; }
.card-footer-brand { font-size:0.4rem; letter-spacing:0.35em; text-transform:uppercase; opacity:0.25; }
.card-footer-wl { font-size:0.42rem; letter-spacing:0.1em; opacity:0.5; }

.card-particles { position:absolute; inset:0; pointer-events:none; z-index:3; border-radius:16px; overflow:hidden; }
.cp { position:absolute; border-radius:50%; animation:cpFloat linear infinite; }
.card-shimmer { position:absolute; inset:0; border-radius:16px; pointer-events:none; z-index:4; background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 55%, transparent 65%); animation:shimmerSlide 5s ease-in-out infinite; }
@keyframes shimmerSlide { 0%{transform:translateX(-100%) skewX(-15deg);} 100%{transform:translateX(200%) skewX(-15deg);} }

.rank-bronze .card-frame { box-shadow:inset 0 0 0 2px rgba(139,90,43,0.6), 0 0 20px rgba(100,60,20,0.3); }
.rank-silver .card-frame { box-shadow:inset 0 0 0 2px rgba(168,180,192,0.7), 0 0 25px rgba(168,180,192,0.2); }
.rank-gold .card-frame { box-shadow:inset 0 0 0 2px rgba(201,168,76,0.9), 0 0 40px rgba(201,168,76,0.4); }
.rank-diamond .card-frame { box-shadow:inset 0 0 0 2px rgba(139,92,246,0.9), 0 0 50px rgba(139,92,246,0.5), 0 0 100px rgba(139,92,246,0.2); }
.rank-legend .card-frame { box-shadow:inset 0 0 0 3px rgba(240,208,128,1), 0 0 80px rgba(201,168,76,0.8), 0 0 160px rgba(201,168,76,0.3); }
.rank-legend .card-frame::before { content:''; position:absolute; inset:-2px; border-radius:18px; background:conic-gradient(from 0deg, #C9A84C, #F0D080, #CC2200, #F0D080, #C9A84C); animation:legendBorder 3s linear infinite; z-index:-1; }
@keyframes legendBorder { to { transform:rotate(360deg); } }
.rank-diamond .card-frame::before { content:''; position:absolute; inset:0; border-radius:16px; background:linear-gradient(135deg, rgba(139,92,246,0.2), transparent 40%, rgba(196,181,253,0.15), transparent 70%, rgba(139,92,246,0.2)); animation:crystalShift 4s ease-in-out infinite alternate; }
@keyframes crystalShift { from{opacity:0.5;transform:rotate(0deg);} to{opacity:1;transform:rotate(5deg);} }

.demo-controls { display:flex; flex-direction:column; align-items:center; gap:12px; }
.demo-title { font-size:0.5rem; letter-spacing:0.4em; color:rgba(168,180,192,0.35); text-transform:uppercase; }
.rank-buttons { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.rank-btn { padding:7px 14px; border-radius:4px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04); color:rgba(168,180,192,0.6); font-family:'Cinzel', serif; font-size:0.5rem; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; transition:all 0.3s; }
.rank-btn:hover { border-color:var(--gold); color:var(--gold-l); }
.rank-btn.active { border-color:var(--gold); color:var(--gold-l); background:rgba(201,168,76,0.08); }

/* ── v2.2 VISUAL UPGRADES ── */
.card-bottom { padding:16px 14px 12px; gap:8px; }
.medallion-stage { position:relative; width:158px; height:158px; display:flex; align-items:center; justify-content:center; }
.medallion-bezel { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; filter:drop-shadow(0 3px 5px rgba(0,0,0,0.65)); pointer-events:none; }
.card-medallion::before, .card-medallion::after { display:none; }
.card-stats { background:linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.2)); border-top:1px solid rgba(201,168,76,0.14); border-bottom:1px solid rgba(201,168,76,0.14); border-radius:5px; padding:8px 4px; box-shadow:inset 0 1px 6px rgba(0,0,0,0.5); }
.card-stat-val { font-size:0.82rem; letter-spacing:0.02em; text-shadow:0 0 8px rgba(0,0,0,0.7); }
.card-stat-label { font-size:0.4rem; letter-spacing:0.14em; }
.card-glare { position:absolute; inset:0; border-radius:16px; pointer-events:none; z-index:5; opacity:0; transition:opacity 0.35s ease; mix-blend-mode:soft-light; background:radial-gradient(circle 130px at 50% 50%, rgba(255,255,255,0.55), rgba(255,255,255,0.12) 38%, transparent 68%); }
.ww-card:hover .card-glare { opacity:0.85; }

/* ── v2.3: frame, ribbon, parallax ── */
.card-emblem { font-size:0.7rem; color:var(--gold); opacity:0.8; letter-spacing:0.1em; }
.card-art-zone { flex-direction:column; gap:6px; }
.rank-ribbon { padding:4px 24px; font-family:'Cinzel', serif; font-size:0.56rem; font-weight:700; letter-spacing:0.34em; text-transform:uppercase; color:#F0D080; background:linear-gradient(180deg, rgba(0,0,0,0.62), rgba(0,0,0,0.32)); border-top:1px solid rgba(201,168,76,0.5); border-bottom:1px solid rgba(201,168,76,0.5); clip-path:polygon(9px 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 9px 100%, 0 50%); box-shadow:0 2px 14px rgba(0,0,0,0.5); z-index:2; text-shadow:0 0 10px rgba(0,0,0,0.6); }
.card-inner-frame { position:absolute; inset:0; z-index:6; pointer-events:none; transition:transform 0.12s ease-out; }
.medallion-stage { transition:transform 0.12s ease-out; }

/* ── v2.4: rank halo (edge glow) ── */
.ww-card.rank-bronze  { box-shadow: 0 0 38px 5px rgba(150,95,40,0.42); }
.ww-card.rank-silver  { box-shadow: 0 0 42px 6px rgba(212,226,238,0.52), 0 0 84px 16px rgba(180,200,220,0.18); }
.ww-card.rank-gold    { box-shadow: 0 0 60px 9px rgba(240,190,90,0.58), 0 0 120px 36px rgba(235,150,40,0.22); }
.ww-card.rank-diamond { box-shadow: 0 0 54px 8px rgba(90,165,240,0.52), 0 0 112px 28px rgba(120,185,255,0.22); }
.ww-card.rank-legend  { animation: legendHalo 1.8s ease-in-out infinite; }
@keyframes legendHalo {
  0%,100% { box-shadow: 0 0 50px 8px rgba(240,210,120,0.55), 0 0 100px 24px rgba(255,180,60,0.25), 0 0 140px 40px rgba(120,180,255,0.12); }
  44%     { box-shadow: 0 0 72px 13px rgba(255,242,205,0.82), 0 0 132px 36px rgba(255,200,80,0.36), 0 0 184px 62px rgba(150,200,255,0.26); }
  58%     { box-shadow: 0 0 38px 5px rgba(220,200,120,0.48), 0 0 88px 20px rgba(255,170,60,0.2); }
  72%     { box-shadow: 0 0 64px 11px rgba(255,235,190,0.7), 0 0 120px 30px rgba(180,210,255,0.3); }
}

/* ── BADGE TOOLTIP ── */
.ww-tip { position:fixed; z-index:99999; pointer-events:none; opacity:0; transition:opacity 0.15s ease; transform:translate(-50%,-100%); background:linear-gradient(180deg, rgba(22,15,7,0.98), rgba(8,5,2,0.98)); border:1px solid rgba(201,168,76,0.5); border-radius:6px; padding:8px 11px; width:max-content; max-width:210px; box-shadow:0 10px 34px rgba(0,0,0,0.75), 0 0 18px rgba(201,168,76,0.15); }
.ww-tip.show { opacity:1; }
.ww-tip-name { font-family:'Cinzel Decorative', serif; font-size:0.62rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#F0D080; margin-bottom:3px; }
.ww-tip-desc { font-family:'IM Fell English', serif; font-size:0.66rem; font-style:italic; line-height:1.35; color:rgba(168,180,192,0.85); }
.ww-tip.locked .ww-tip-name { color:#8a8f96; }
.ww-tip.locked .ww-tip-name::after { content:' · locked'; font-family:'Cinzel', serif; font-style:normal; font-size:0.46rem; letter-spacing:0.2em; opacity:0.6; }
/* ── v2.5: shield backdrop + photo medallion ── */
.card-mount { position:relative; width:320px; height:560px; display:flex; align-items:center; justify-content:center; margin:30px 0; }
.card-backdrop { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:146%; height:124%; object-fit:contain; z-index:0; pointer-events:none; opacity:0.82; filter:blur(1.1px) saturate(1.06) brightness(0.92); -webkit-mask:radial-gradient(ellipse 58% 56% at 50% 46%, #000 46%, rgba(0,0,0,0) 100%); mask:radial-gradient(ellipse 58% 56% at 50% 46%, #000 46%, rgba(0,0,0,0) 100%); transition:transform 0.12s ease-out; }
.ww-card { z-index:1; }
.medallion-img { width:152px; height:152px; object-fit:contain; position:relative; z-index:2; filter:drop-shadow(0 3px 7px rgba(0,0,0,0.6)); }
</style>
</head>
<body>

<div class="forge-bar">
  <div class="forge-title">⚔ Forge a Combat Card ⚔</div>
  <div class="forge-row">
    <input class="forge-input" id="walletInput" placeholder="0x... wallet address" value="0xAC3a89EA9dA567e86E97FEe815b90b804dd2fc55">
    <button class="forge-btn" onclick="forge(document.getElementById('walletInput').value)">Forge</button>
  </div>
  <div class="forge-status" id="forgeStatus"></div>
</div>

<div class="card-mount" id="cardMount">
  <img class="card-backdrop" id="cardBackdrop" alt="">
<div class="ww-card rank-bronze" id="theCard">
  <canvas class="card-canvas" id="artCanvas" width="320" height="560"></canvas>
  <div class="card-overlay" id="cardOverlay"></div>
  <div class="card-particles" id="cardParticles"></div>
  <div class="card-shimmer"></div>
  <div class="card-glare" id="cardGlare"></div>
  <div class="card-inner-frame" id="cardInnerFrame"></div>
  <div class="card-frame" id="cardFrame"></div>
  <div class="card-content">
    <div class="card-top">
      <div class="card-emblem">⚔</div>
      <div class="card-season">Season I</div>
    </div>
    <div class="card-art-zone">
      <div class="medallion-stage">
        <img class="medallion-img" id="medallionImg" alt="">
      </div>
      <div class="rank-ribbon" id="rankRibbon">BRONZE</div>
    </div>
    <div class="card-bottom">
      <div class="card-name-row">
        <div class="card-name" id="cardName" style="color:#C9A84C;">UNCLAIMED</div>
        <div class="card-title" id="cardTitle">Awaiting the forge</div>
      </div>
      <div class="card-power-row">
        <div class="card-power-label" style="color:var(--silver);">Wallet Power</div>
        <div class="card-power-track"><div class="card-power-fill" id="powerFill" style="width:0%;background:linear-gradient(to right,#8B6914,#C9A84C,#F0D080);"></div></div>
        <div class="card-power-val" id="powerVal" style="color:#C9A84C;">0</div>
      </div>
      <div class="card-divider" style="color:var(--gold);"></div>
      <div class="card-stats">
        <div class="card-stat"><div class="card-stat-val" id="statTx" style="color:var(--gold-l);">—</div><div class="card-stat-label">Txs</div></div>
        <div class="card-stat"><div class="card-stat-val" id="statAge" style="color:var(--silver);">—</div><div class="card-stat-label">Age</div></div>
        <div class="card-stat"><div class="card-stat-val" id="statContracts" style="color:var(--gold-l);">—</div><div class="card-stat-label">Contracts</div></div>
        <div class="card-stat"><div class="card-stat-val" id="statTokens" style="color:var(--silver);">—</div><div class="card-stat-label">Tokens</div></div>
        <div class="card-stat"><div class="card-stat-val" id="statGas" style="color:#FF8844;">—</div><div class="card-stat-label">Gas</div></div>
      </div>
      <div class="card-networth">
        <div class="card-networth-label">Net Worth</div>
        <div class="card-networth-val" id="netWorthVal">—</div>
      </div>
      <div class="card-divider" style="color:var(--silver);"></div>
      <div class="card-badge-block">
        <div class="card-badge-rowlabel">Combat</div>
        <div class="card-badges" id="combatBadges">
          <div class="card-badge locked" data-name="First Blood" data-desc="The first kill is always the sweetest." style="color:#CC2200;">🩸</div>
          <div class="card-badge locked" data-name="On Fire" data-desc="Five wins in a row. Nobody's stopping you." style="color:#FF6600;">🔥</div>
          <div class="card-badge locked" data-name="Giant Killer" data-desc="You slayed a wallet mightier than yours.">💀</div>
          <div class="card-badge locked" data-name="Untouchable" data-desc="Won a battle without losing a single round.">⚡</div>
          <div class="card-badge locked" data-name="Base Legend" data-desc="Among the deadliest warriors of the Season.">👑</div>
        </div>
        <div class="card-badge-rowlabel">Profile</div>
        <div class="card-badges" id="profileBadges">
          <div class="card-badge locked" data-key="OG" data-name="OG" data-desc="On Base before it was cool. Over a year deep." style="color:#C9A84C;">⏳</div>
          <div class="card-badge locked" data-key="Explorer" data-name="Explorer" data-desc="Has touched the far corners of Base." style="color:#60c0ff;">🧭</div>
          <div class="card-badge locked" data-key="Collector" data-name="Collector" data-desc="Treasures gathered across many collections." style="color:#c4b5fd;">🖼️</div>
          <div class="card-badge locked" data-key="Builder" data-name="Builder" data-desc="Didn't just use Base — built on it." style="color:#FF8844;">🔨</div>
        </div>
      </div>
      <div class="card-footer">
        <div class="card-footer-brand" style="color:var(--gold);">⚔ WALLETWARS</div>
        <div class="card-footer-wl" id="footerWL" style="color:var(--silver);">0W · 0L</div>
      </div>
    </div>
  </div>
</div>
</div>

<div class="demo-controls">
  <div class="demo-title">Rank preview (visual evolution)</div>
  <div class="rank-buttons">
    <button class="rank-btn active" onclick="setRank('bronze')">🥉 Bronze</button>
    <button class="rank-btn" onclick="setRank('silver')">🥈 Silver</button>
    <button class="rank-btn" onclick="setRank('gold')">🥇 Gold</button>
    <button class="rank-btn" onclick="setRank('diamond')">💎 Diamond</button>
    <button class="rank-btn" onclick="setRank('legend')">👑 Legend</button>
  </div>
</div>

<script>
// ── GENERATIVE ART SEED (from wallet address) ──
let WALLET = '0xAC3a89EA9dA567e86E97FEe815b90b804dd2fc55';
let seed, hue, hue2, pattern, chaos, density;
let currentRank = 'bronze';
let cardPower = 0;

function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=Math.imul(31,h)+str.charCodeAt(i)|0; } return Math.abs(h); }
function seededRand(s,n){ const x=Math.sin(s+n)*10000; return x-Math.floor(x); }

function setWalletSeed(addr){
  WALLET = addr;
  seed    = hashSeed(addr);
  hue     = Math.floor(seededRand(seed,1)*360);

// ── MEDALLION BEZEL (forged ring + rivets, per rank) ──
function buildBezel(rank){
  const m=(RANK_CONFIG[rank].metal)||['#444','#999','#ddd'];
  const cx=79,cy=79,bandR=58,n=12; let rivets='';
  for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2 - Math.PI/2; const x=cx+Math.cos(a)*bandR, y=cy+Math.sin(a)*bandR;
    rivets+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="url(#rvt)" stroke="${m[0]}" stroke-width="0.7"/><circle cx="${(x-0.9).toFixed(1)}" cy="${(y-0.9).toFixed(1)}" r="1.1" fill="${m[2]}" opacity="0.85"/>`;
  }
  return `<svg viewBox="0 0 158 158" width="158" height="158" xmlns="http://www.w3.org/2000/svg"><defs>`+
    `<linearGradient id="bnd" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${m[2]}"/><stop offset="22%" stop-color="${m[1]}"/><stop offset="50%" stop-color="${m[0]}"/><stop offset="78%" stop-color="${m[1]}"/><stop offset="100%" stop-color="${m[2]}"/></linearGradient>`+
    `<radialGradient id="rvt" cx="36%" cy="36%" r="68%"><stop offset="0%" stop-color="${m[2]}"/><stop offset="55%" stop-color="${m[1]}"/><stop offset="100%" stop-color="${m[0]}"/></radialGradient></defs>`+
    `<circle cx="79" cy="79" r="64" fill="none" stroke="${m[0]}" stroke-width="2" opacity="0.45"/>`+
    `<circle cx="79" cy="79" r="58" fill="none" stroke="url(#bnd)" stroke-width="10"/>`+
    `<circle cx="79" cy="79" r="63" fill="none" stroke="${m[2]}" stroke-width="0.8" opacity="0.55"/>`+
    `<circle cx="79" cy="79" r="53" fill="none" stroke="${m[0]}" stroke-width="0.9" opacity="0.7"/>`+
    rivets+`</svg>`;
}

// ── INNER FRAME (double border + corner filigree, per rank) ──
function buildInnerFrame(rank){
  const m=(RANK_CONFIG[rank].metal)||['#444','#999','#ddd'];
  return `<svg viewBox="0 0 320 560" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs><g id="cnr">`+
    `<path d="M10,42 L10,18 Q10,10 18,10 L42,10" fill="none" stroke="${m[1]}" stroke-width="1.3" opacity="0.75"/>`+
    `<path d="M17,24 Q24,17 31,17" fill="none" stroke="${m[2]}" stroke-width="0.8" opacity="0.6"/>`+
    `<circle cx="14" cy="14" r="2.2" fill="none" stroke="${m[1]}" stroke-width="1"/>`+
    `<circle cx="14" cy="14" r="0.9" fill="${m[2]}"/>`+
    `</g></defs>`+
    `<rect x="7" y="7" width="306" height="546" rx="12" fill="none" stroke="${m[1]}" stroke-width="1" opacity="0.35"/>`+
    `<rect x="10" y="10" width="300" height="540" rx="10" fill="none" stroke="${m[2]}" stroke-width="0.5" opacity="0.18"/>`+
    `<use href="#cnr"/>`+
    `<use href="#cnr" transform="translate(320,0) scale(-1,1)"/>`+
    `<use href="#cnr" transform="translate(0,560) scale(1,-1)"/>`+
    `<use href="#cnr" transform="translate(320,560) scale(-1,-1)"/>`+
    `</svg>`;
}

// ── ART ENGINE ──
function drawArt(rank){
  const canvas=document.getElementById('artCanvas'); const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height; const cfg=RANK_CONFIG[rank]; ctx.clearRect(0,0,W,H);
  const bgGrad=ctx.createRadialGradient(W/2,H*0.38,0,W/2,H*0.38,W*0.9);
  const sat=Math.round(cfg.saturation*30); const bri=Math.round(cfg.brightness*8);
  bgGrad.addColorStop(0,`hsl(${hue},${sat}%,${bri+4}%)`); bgGrad.addColorStop(0.5,`hsl(${hue},${sat}%,${bri+1}%)`); bgGrad.addColorStop(1,`hsl(${hue2},${Math.round(sat*0.6)}%,${bri-1}%)`);
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=0.08+cfg.saturation*0.12;
  if(pattern===0)drawHexGrid(ctx,W,H); else if(pattern===1)drawCircuits(ctx,W,H); else if(pattern===2)drawRunes(ctx,W,H); else if(pattern===3)drawTriangles(ctx,W,H); else drawWaves(ctx,W,H);
  ctx.restore();
  if(rank==='gold'||rank==='legend'){ const g=ctx.createRadialGradient(W/2,H*0.36,0,W/2,H*0.36,W*0.5); g.addColorStop(0,`rgba(201,168,76,${0.12*cfg.saturation})`); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  if(rank==='diamond'){ const g=ctx.createRadialGradient(W/2,H*0.36,0,W/2,H*0.36,W*0.55); g.addColorStop(0,'rgba(139,92,246,0.15)'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
  if(rank==='legend'){ ctx.save(); ctx.translate(W/2,H*0.38); for(let i=0;i<12;i++){ const a=(i/12)*Math.PI*2; const g=ctx.createLinearGradient(0,0,Math.cos(a)*W,Math.sin(a)*H); g.addColorStop(0,'rgba(240,208,128,0.08)'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a-0.06)*W,Math.sin(a-0.06)*H); ctx.lineTo(Math.cos(a+0.06)*W,Math.sin(a+0.06)*H); ctx.closePath(); ctx.fill(); } ctx.restore(); }
  if(cfg.scars>0)drawScars(ctx,W,H,cfg.scars,rank);
  const vig=ctx.createRadialGradient(W/2,H/2,W*0.2,W/2,H/2,W*0.95); vig.addColorStop(0,'transparent'); vig.addColorStop(1,'rgba(0,0,0,0.6)'); ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  const fade=ctx.createLinearGradient(0,H*0.45,0,H); fade.addColorStop(0,'transparent'); fade.addColorStop(1,'rgba(0,0,0,0.95)'); ctx.fillStyle=fade; ctx.fillRect(0,0,W,H);
}
function drawHexGrid(ctx,W,H){ const size=22+seededRand(seed,10)*20; ctx.strokeStyle=`hsl(${hue},80%,60%)`; ctx.lineWidth=0.8; for(let row=-1;row<H/size+1;row++){ for(let c=-1;c<W/(size*1.7)+1;c++){ const x=c*size*1.73+(row%2)*size*0.87; const y=row*size*1.5; ctx.beginPath(); for(let i=0;i<6;i++){ const a=(i*60-30)*Math.PI/180; i===0?ctx.moveTo(x+Math.cos(a)*size*0.9,y+Math.sin(a)*size*0.9):ctx.lineTo(x+Math.cos(a)*size*0.9,y+Math.sin(a)*size*0.9); } ctx.closePath(); ctx.stroke(); } } }
function drawCircuits(ctx,W,H){ ctx.strokeStyle=`hsl(${hue},70%,55%)`; ctx.lineWidth=1; const lines=18+Math.floor(seededRand(seed,11)*20); for(let i=0;i<lines;i++){ const x=seededRand(seed,20+i)*W; const y=seededRand(seed,40+i)*H; ctx.beginPath(); ctx.moveTo(x,y); let cx=x,cy=y; for(let j=0;j<4;j++){ const dir=Math.floor(seededRand(seed,60+i*4+j)*4); const len=20+seededRand(seed,80+i*4+j)*60; if(dir===0)cx+=len; else if(dir===1)cy+=len; else if(dir===2)cx-=len; else cy-=len; ctx.lineTo(cx,cy); ctx.arc(cx,cy,2,0,Math.PI*2); ctx.moveTo(cx,cy); } ctx.stroke(); } }
function drawRunes(ctx,W,H){ ctx.fillStyle=`hsl(${hue},60%,50%)`; ctx.font=`${16+seededRand(seed,12)*20}px 'Cinzel', serif`; const runes=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛇ','ᛈ','ᛉ','ᛊ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛜ','ᛞ','ᛟ']; for(let i=0;i<30;i++){ ctx.globalAlpha=0.05+seededRand(seed,100+i)*0.1; const r=runes[Math.floor(seededRand(seed,130+i)*runes.length)]; ctx.fillText(r,seededRand(seed,160+i)*W,seededRand(seed,190+i)*H); } }
function drawTriangles(ctx,W,H){ for(let i=0;i<25;i++){ const x=seededRand(seed,200+i)*W,y=seededRand(seed,230+i)*H; const s=15+seededRand(seed,260+i)*50; ctx.strokeStyle=`hsl(${hue2},70%,55%)`; ctx.lineWidth=0.8; ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s*0.87,y+s*0.5); ctx.lineTo(x-s*0.87,y+s*0.5); ctx.closePath(); ctx.stroke(); } }
function drawWaves(ctx,W,H){ for(let i=0;i<20;i++){ ctx.strokeStyle=`hsl(${hue},65%,50%)`; ctx.lineWidth=0.8; const yBase=(i/20)*H; const amp=10+seededRand(seed,300+i)*25; const freq=0.01+seededRand(seed,320+i)*0.03; ctx.beginPath(); for(let x=0;x<=W;x+=3){ const y=yBase+Math.sin(x*freq+seededRand(seed,340+i)*Math.PI*2)*amp; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); } }
function drawScars(ctx,W,H,count,rank){ ctx.save(); const sc={silver:'rgba(200,210,220,0.25)',gold:'rgba(180,100,20,0.35)',diamond:'rgba(100,60,180,0.3)',legend:'rgba(200,50,0,0.4)'}; ctx.strokeStyle=sc[rank]||'rgba(200,200,200,0.2)'; for(let i=0;i<count;i++){ const x1=seededRand(seed,400+i*3)*W*0.8+W*0.1; const y1=seededRand(seed,401+i*3)*H*0.5+H*0.1; const len=30+seededRand(seed,402+i*3)*80; const a=seededRand(seed,403+i*3)*Math.PI; ctx.lineWidth=1+seededRand(seed,404+i*3)*2; ctx.globalAlpha=0.4+seededRand(seed,405+i*3)*0.4; ctx.beginPath(); ctx.moveTo(x1,y1); const mx=x1+Math.cos(a)*len*0.4+(seededRand(seed,406+i*3)-0.5)*20; const my=y1+Math.sin(a)*len*0.4+(seededRand(seed,407+i*3)-0.5)*20; ctx.lineTo(mx,my); ctx.lineTo(x1+Math.cos(a)*len,y1+Math.sin(a)*len); ctx.stroke(); if(rank==='diamond'||rank==='legend'){ ctx.globalAlpha=0.15; ctx.lineWidth*=4; ctx.stroke(); } } ctx.restore(); }

function updateCardUI(rank){
  const cfg=RANK_CONFIG[rank]; const card=document.getElementById('theCard');
  card.className=`ww-card rank-${rank}`;
  const rib=document.getElementById('rankRibbon'); if(rib){ rib.textContent=cfg.label.split(' ').slice(1).join(' '); rib.style.color=cfg.labelColor; rib.style.borderTopColor=cfg.badgeColor; rib.style.borderBottomColor=cfg.badgeColor; }
  const mi=document.getElementById('medallionImg'); if(mi&&MED_DATA[rank]) mi.src=MED_DATA[rank];
  const bgi=document.getElementById('cardBackdrop'); if(bgi&&BG_DATA[rank]) bgi.src=BG_DATA[rank];
  const ifr=document.getElementById('cardInnerFrame'); if(ifr) ifr.innerHTML=buildInnerFrame(rank);
  document.getElementById('cardName').style.color=cfg.nameColor;
  const pf=document.getElementById('powerFill'); pf.style.background=cfg.powerGradient; document.getElementById('powerVal').style.color=cfg.powerColor;
  pf.style.width=Math.min(95,Math.round(cardPower/60))+'%';
  document.getElementById('cardOverlay').style.background=cfg.overlay;
  updateParticles(rank,cfg); drawArt(rank);
  document.querySelectorAll('.rank-btn').forEach(b=>{ b.classList.toggle('active', b.textContent.toLowerCase().includes(rank)); });
}

function updateParticles(rank,cfg){
  const container=document.getElementById('cardParticles'); container.innerHTML='';
  if(!cfg.particles||cfg.particles.length===0)return;
  const configs={ fire:{colors:['#FF2200','#FF6600','#FFAA00','#FF4400'],count:20,sizeMin:2,sizeMax:5,bottom:'0%',riseMin:150,riseMax:300}, gold:{colors:['#F0D080','#C9A84C','#FFEE88','#FFD700'],count:15,sizeMin:1,sizeMax:4,bottom:'20%',riseMin:100,riseMax:220}, crystal:{colors:['#c4b5fd','#8b5cf6','#e0d7ff','#a78bfa'],count:18,sizeMin:2,sizeMax:5,bottom:'10%',riseMin:120,riseMax:270}, silver:{colors:['#A8B4C0','#D0DDE8','#E2E8F0','#94A3B8'],count:10,sizeMin:1,sizeMax:3,bottom:'15%',riseMin:80,riseMax:180}, legend:{colors:['#F0D080','#FF4400','#FFEE00','#FF2200'],count:25,sizeMin:2,sizeMax:6,bottom:'0%',riseMin:180,riseMax:340} };
  cfg.particles.forEach(type=>{ const pc=configs[type]; if(!pc)return; for(let i=0;i<pc.count;i++){ const p=document.createElement('div'); p.className='cp'; const sz=pc.sizeMin+Math.random()*(pc.sizeMax-pc.sizeMin); const col=pc.colors[Math.floor(Math.random()*pc.colors.length)]; const rise=pc.riseMin+Math.random()*(pc.riseMax-pc.riseMin); p.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${pc.bottom};background:${col};box-shadow:0 0 ${sz*2}px ${col};animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;`; p.style.setProperty('--rise',`-${rise}px`); container.appendChild(p); } });

// ── LIVE DATA: fetch the real backend and paint the card ──
const fmt = n => (n==null ? '—' : Number(n).toLocaleString('en-US'));
const fmtAge = d => (d==null ? '—' : (d>=365 ? (d/365).toFixed(1)+'y' : d+'d'));
function setStatus(msg){ document.getElementById('forgeStatus').textContent=msg; }

function setProfileBadge(key, earned){
  const el=document.querySelector(`#profileBadges .card-badge[data-key="${key}"]`);
  if(!el)return;
  el.className = earned ? 'card-badge earned' : 'card-badge locked';
}

function applyData(d){
  setWalletSeed(d.address || WALLET);
  document.getElementById('statTx').textContent        = fmt(d.txCount);
  document.getElementById('statAge').textContent       = fmtAge(d.ageDays);
  document.getElementById('statContracts').textContent = fmt(d.uniqueContracts);
  document.getElementById('statTokens').textContent    = fmt(d.realTokenCount);
  document.getElementById('statGas').textContent       = (d.gasBurnedUsd!=null) ? '$'+fmt(d.gasBurnedUsd) : '—';
  document.getElementById('netWorthVal').textContent   = (d.netWorth!=null) ? '$'+fmt(d.netWorth) : '—';

  // Wallet Power = composite of the 5 combat dimensions (weights provisional, to calibrate)
  cardPower = (d.txCount||0) + (d.ageDays||0) + (d.uniqueContracts||0)*5 + (d.realTokenCount||0)*30 + Math.round(d.gasBurnedUsd||0)*10;
  document.getElementById('powerVal').textContent = fmt(cardPower);

  // Profile badges from real data
  const pb = d.profileBadges || {};
  setProfileBadge('OG', pb.OG); setProfileBadge('Explorer', pb.Explorer);
  setProfileBadge('Collector', pb.Collector); setProfileBadge('Builder', pb.Builder);

  // Combat badges stay locked until real combat exists; fresh card = 0W 0L
  document.getElementById('footerWL').textContent = '0W · 0L';
  document.getElementById('cardName').textContent = 'WARRIOR';
  document.getElementById('cardTitle').textContent = 'Forged on Base';

  // fresh forge = bronze; re-render art with this wallet's seed
  currentRank = 'bronze';
  updateCardUI('bronze');
}

async function forge(addr){
  addr=(addr||'').trim();
  if(!/^0x[a-fA-F0-9]{40}$/.test(addr)){ setStatus('Dirección no válida'); return; }
  setStatus('Forjando…');
  try {
    const r = await fetch(`/api/wallet/${addr}`);
    const d = await r.json();
    if(d.error){ setStatus(d.error); return; }
    applyData(d);
    setStatus('');
  } catch(e){ setStatus('No se pudo conectar con el backend (¿server.js corriendo?)'); }
}

card.addEventListener('mouseleave', ()=>{ card.style.transform=''; card.style.transition='transform 0.6s cubic-bezier(0.23,1,0.32,1)'; if(mStage) mStage.style.transform=''; if(innerFrameEl) innerFrameEl.style.transform=''; const _bg=document.getElementById('cardBackdrop'); if(_bg) _bg.style.transform='translate(-50%,-50%)'; });
card.addEventListener('mouseenter', ()=>{ card.style.transition='transform 0.1s ease'; });

// ── SWORD-CLASH SPARK TRAIL ──
const SPARK_COLORS=['#FFF1B0','#FFD86A','#FF9A3C','#FFE8A0','#ffffff'];
function spawnSpark(x,y){
  const angle=Math.random()*Math.PI*2;
  const speed=16+Math.random()*42;
  const dx=Math.cos(angle)*speed;
  const dy=Math.sin(angle)*speed+16;            // gravity bias
  const rot=Math.atan2(dy,dx)+Math.PI/2;
  const len=4+Math.random()*9;
  const col=SPARK_COLORS[(Math.random()*SPARK_COLORS.length)|0];
  const s=document.createElement('div');
  s.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:2px;height:${len.toFixed(1)}px;background:linear-gradient(180deg,${col},transparent);box-shadow:0 0 6px ${col},0 0 12px rgba(255,170,70,0.5);border-radius:2px;pointer-events:none;z-index:99998;`;
  document.body.appendChild(s);
  s.animate([
    {transform:`translate(-50%,-50%) rotate(${rot}rad) scale(1)`,opacity:1},
    {transform:`translate(calc(-50% + ${dx.toFixed(0)}px), calc(-50% + ${dy.toFixed(0)}px)) rotate(${rot}rad) scale(0.3)`,opacity:0}
  ],{duration:360+Math.random()*280,easing:'cubic-bezier(0.15,0.7,0.4,1)'}).onfinish=()=>s.remove();
}
let _lx=null,_ly=null;
card.addEventListener('mousemove', e=>{
  const cx=e.clientX, cy=e.clientY;
  if(_lx===null){_lx=cx;_ly=cy;}
  if(Math.hypot(cx-_lx,cy-_ly)>5){
    const n=1+(Math.random()*2|0);
    for(let i=0;i<n;i++) spawnSpark(cx,cy);
    if(Math.random()<0.12){ for(let i=0;i<8;i++) spawnSpark(cx,cy); }  // clash burst
    _lx=cx; _ly=cy;
  }
});

// ── INIT ──
updateCardUI('bronze');
</script>
